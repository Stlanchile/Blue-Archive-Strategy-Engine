[workspace]
resolver = "3"
members = [
    "crates/ba-core",
    "crates/ba-engine",
    "crates/ba-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
sha2 = "0.10.9"
rand_core = "0.9.5"
rand_chacha = "0.9.0"
clap = { version = "4.6.6", features = ["derive"] }
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
